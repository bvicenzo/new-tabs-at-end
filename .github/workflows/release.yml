name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

# Releases are cut one at a time, in the order the merges landed.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release and package
    runs-on: ubuntu-latest
    steps:
      # Opens or updates the release pull request; merging it tags the version and creates the GitHub release.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # A personal token, not GITHUB_TOKEN: the release pull request is then opened by a user, so the CI runs on it
          # like on any other pull request instead of waiting for approval (0011).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - if: ${{ steps.release.outputs.release_created }}
        run: npm ci

      # The zip is what gets uploaded to the Chrome Web Store, by hand (docs/publishing.md).
      - if: ${{ steps.release.outputs.release_created }}
        name: Attach the extension package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          npm run package
          gh release upload "$TAG" new-tabs-at-end-*.zip
